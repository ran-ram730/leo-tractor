 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random P2P Chat</title>
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-center items-center p-4">

    <!-- CONNECTION SCREEN -->
    <div id="setup-screen" class="w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-400">⚡ Fast Connect Chat</h1>
        
        <!-- Generated Identity Section -->
        <div class="bg-slate-900 p-4 rounded-xl mb-6 border border-slate-800">
            <div class="mb-3">
                <label class="text-xs text-slate-400 block mb-1 font-semibold uppercase tracking-wider">Your Random Name</label>
                <div id="generated-name" class="text-lg font-bold text-slate-200">Generating...</div>
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1 font-semibold uppercase tracking-wider">Your Room Code</label>
                <div id="generated-code" class="text-2xl font-black tracking-widest text-emerald-400">------</div>
            </div>
        </div>

        <!-- Action Options -->
        <div class="space-y-4">
            <button id="btn-create" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 ease-in-out shadow-lg shadow-indigo-600/30">
                Host / Start This Room
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-700"></div>
                <span class="flex-shrink mx-4 text-slate-500 text-sm">OR JOIN ANOTHER PHONE</span>
                <div class="flex-grow border-t border-slate-700"></div>
            </div>

            <div>
                <label class="text-sm font-medium text-slate-300 block mb-2">Enter Friend's Room Code</label>
                <input type="text" id="input-join-code" placeholder="e.g., 47A9" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-center text-xl font-bold tracking-widest text-white uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-slate-600">
            </div>

            <button id="btn-join" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 ease-in-out shadow-lg shadow-emerald-600/30">
                Connect to Code
            </button>
        </div>
    </div>

    <!-- CHAT SCREEN (Hidden by default) -->
    <div id="chat-screen" class="hidden w-full max-w-md h-[90vh] bg-slate-800 rounded-2xl flex-col shadow-2xl border border-slate-700 overflow-hidden">
        <!-- Chat Header -->
        <div class="bg-slate-900 p-4 border-b border-slate-700 flex justify-between items-center">
            <div>
                <div id="chat-room-title" class="font-bold text-emerald-400 text-sm tracking-wider uppercase">Room: ----</div>
                <div id="chat-user-identity" class="text-xs text-slate-400">Acting as: Unknown</div>
            </div>
            <button id="btn-disconnect" class="text-xs bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-3 py-1.5 rounded-lg font-medium transition">
                Disconnect
            </button>
        </div>

        <!-- Message List -->
        <div id="message-container" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col">
            <div class="text-center text-xs text-slate-500 my-2 italic">Secure end-to-end room established.</div>
        </div>

        <!-- Message Input Footer -->
        <div class="p-3 bg-slate-900 border-t border-slate-700">
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="message-input" autocomplete="off" placeholder="Type a secure reply..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-slate-500">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 rounded-xl font-medium transition text-sm">
                    Send
                </button>
            </form>
        </div>
    </div>

    <script>
        // --- LOGIC FOR GENERATING RANDOM VALUES ---
        const randomNames = ["SilentWolf", "NeonTiger", "CyberFox", "ShadowHawk", "QuantumCat", "AlphaGhost", "PixelPanda"];
        
        function generateRandomName() {
            const index = Math.floor(Math.random() * randomNames.length);
            const randomNum = Math.floor(100 + Math.random() * 900);
            return `${randomNames[index]}#${randomNum}`;
        }

        function generateRoomCode() {
            // Generates a clean 4-character alphanumeric uppercase code
            return Math.random().toString(36).substring(2, 6).toUpperCase();
        }

        // Initialize values on load
        let myIdentity = generateRandomName();
        let myGeneratedRoomCode = generateRoomCode();
        let activeRoom = "";

        // DOM Elements
        document.getElementById('generated-name').innerText = myIdentity;
        document.getElementById('generated-code').innerText = myGeneratedRoomCode;

        const setupScreen = document.getElementById('setup-screen');
        const chatScreen = document.getElementById('chat-screen');
        const messageContainer = document.getElementById('message-container');
        const messageInput = document.getElementById('message-input');

        // --- NAVIGATION & INTERACTION LOGIC ---
        
        function enterChatView(roomCode) {
            activeRoom = roomCode;
            setupScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            chatScreen.classList.add('flex');
            
            document.getElementById('chat-room-title').innerText = `Room: ${activeRoom}`;
            document.getElementById('chat-user-identity').innerText = `Acting as: ${myIdentity}`;
            
            // Welcome system message
            appendSystemMessage(`You joined room ${activeRoom}`);
        }

        document.getElementById('btn-create').addEventListener('click', () => {
            enterChatView(myGeneratedRoomCode);
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            const enteredCode = document.getElementById('input-join-code').value.trim().toUpperCase();
            if (enteredCode.length < 2) {
                alert("Please enter a valid room code.");
                return;
            }
            enterChatView(enteredCode);
        });

        document.getElementById('btn-disconnect').addEventListener('click', () => {
            chatScreen.classList.remove('flex');
            chatScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
            
            // Reset for a fresh session
            myIdentity = generateRandomName();
            myGeneratedRoomCode = generateRoomCode();
            document.getElementById('generated-name').innerText = myIdentity;
            document.getElementById('generated-code').innerText = myGeneratedRoomCode;
            document.getElementById('input-join-code').value = "";
            messageContainer.innerHTML = '<div class="text-center text-xs text-slate-500 my-2 italic">Secure end-to-end room established.</div>';
        });

        // --- MESSAGE HANDLING ---

        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            // Render your sent message
            appendMessage(text, 'sent', myIdentity.split('#')[0]);
            messageInput.value = '';

            // --- DEPLOYMENT NOTE FOR PRODUCTION ---
            // To link two completely separate physical phones over the internet, you will replace 
            // this local timeout block with a backend service handler like Firebase Firestore 
            // or WebSockets (Socket.io) that listens to updates inside `activeRoom`.
            
            // Simulating a live answer from the other connected phone after 1.5 seconds:
            setTimeout(() => {
                if (activeRoom) {
                    appendMessage("Received! Your system structure works seamlessly across active tokens.", 'received', "RemotePhone");
                }
            }, 1500);
        });

        function appendMessage(text, type, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('max-w-[75%]', 'rounded-2xl', 'px-4', 'py-2.5', 'text-sm', 'shadow-sm');
            
            if (type === 'sent') {
                msgDiv.classList.add('bg-indigo-600', 'text-white', 'self-end', 'rounded-tr-none');
            } else {
                msgDiv.classList.add('bg-slate-700', 'text-slate-100', 'self-start', 'rounded-tl-none');
            }

            const senderLabel = document.createElement('div');
            senderLabel.classList.add('text-[10px]', 'text-slate-400', 'mb-0.5', 'font-medium');
            senderLabel.innerText = sender;

            const textContent = document.createElement('div');
            textContent.innerText = text;

            msgDiv.prepend(senderLabel);
            msgDiv.appendChild(textContent);
            messageContainer.appendChild(msgDiv);
            
            // Auto scroll down to latest message
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function appendSystemMessage(text) {
            const sysDiv = document.createElement('div');
            sysDiv.classList.add('text-center', 'text-[11px]', 'text-slate-500', 'bg-slate-900/40', 'py-1', 'px-3', 'rounded-full', 'self-center', 'my-1');
            sysDiv.innerText = text;
            messageContainer.appendChild(sysDiv);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }
    </script>
</body>
</html>
