 <!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-adsense-account" content="ca-pub-6432140563201928">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Profile Analytics</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6432140563201928"
     crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background me glowing orbs aesthetic look ke liye */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
        }
        body::before {
            background: #8b5cf6;
            top: 20%;
            left: 25%;
            animation: float 6s ease-in-out infinite alternate;
        }
        body::after {
            background: #ec4899;
            bottom: 20%;
            right: 25%;
            animation: float 6s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(20px); }
        }

        /* Glassmorphism Card Container */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        .logo-area {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        h2 {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Input Wrapper & Style */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            outline: none;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.2);
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        /* Aesthetic Gradient Button */
        .btn-search {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
            transition: all 0.3s ease;
        }

        .btn-search:hover {
            opacity: 0.9;
            box-shadow: 0 12px 25px rgba(168, 85, 247, 0.5);
            transform: scale(1.01);
        }

        .btn-search:active {
            transform: scale(0.99);
        }

        /* Custom Modern Alert Box (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e1b4b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 320px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 { color: #f472b6; margin-bottom: 10px; }
        .modal-content p { color: #cbd5e1; margin-bottom: 20px; }
        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .modal-close:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="logo-area">✧</div>
    <h2>Lens View</h2>
    <p>Analyze and fetch public database structures for the requested handle legally.</p>
    
    <div class="input-group">
        <input type="text" id="usernameInput" placeholder="Enter username (e.g., @alex)">
    </div>
    
    <button class="btn-search" onclick="showAestheticAlert()">Analyze Profile</button>
</div>

<!-- Custom Aesthetic Modal -->
<div class="modal" id="customModal">
    <div class="modal-content">
        <h3>Security Notice</h3>
        <p>Bypassing private IDs is restricted by cloud firewalls. This UI serves as a frontend design concept.</p>
        <button class="modal-close" onclick="closeModal()">Understood</button>
    </div>
</div>

<script>
    function showAestheticAlert() {
        const input = document.getElementById('usernameInput').value;
        if(input.trim() === "") {
            alert("Please enter a username first!");
            return;
        }
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }
</script>

</body>
</html>
